[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-ci"
version = "0.1.1"
description = "Learn which tests matter for a change, run that causal frontier, and keep an exploration reserve."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Antti Luode / GPT-5.6 Sol"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
concrete = "concrete.cli:main"

[tool.setuptools.packages.find]
include = ["concrete*"]
exclude = ["ConcreteVideo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
