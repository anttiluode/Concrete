name: ConcreteVideo

on:
  push:
    paths:
      - "ConcreteVideo/**"
      - ".github/workflows/concretevideo.yml"
  pull_request:
    paths:
      - "ConcreteVideo/**"
      - ".github/workflows/concretevideo.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ConcreteVideo/requirements.txt
      - run: python -m pytest -q
        working-directory: ConcreteVideo
